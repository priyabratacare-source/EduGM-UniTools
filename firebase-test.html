<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebase Diagnostic — EduGM</title>
<style>
  body{font-family:Arial,sans-serif;background:#f8f9ff;color:#202036;padding:24px;line-height:1.6;max-width:720px;margin:0 auto}
  h1{font-size:20px;margin:0 0 6px}
  .sub{color:#77768b;font-size:13px;margin-bottom:18px}
  .row{padding:12px 14px;border-radius:8px;margin-bottom:10px;font-size:14px;border:1px solid}
  .pending{background:#eff4ff;border-color:#d3e1ff;color:#1e44a8}
  .ok{background:#ecfaf3;border-color:#bfefd8;color:#0e7a52}
  .fail{background:#fff1f1;border-color:#ffd5d5;color:#a12323}
  .info{background:#fff8e6;border-color:#ffe4a8;color:#805400}
  code{background:#fff;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:12px;border:1px solid #e0d8ff}
  input{padding:10px 12px;border:1px solid #cbd7e8;border-radius:8px;font-size:14px;width:100%;margin-bottom:8px;box-sizing:border-box}
  button{background:#6546e8;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;margin:4px 4px 4px 0}
  button:disabled{opacity:.55;cursor:not-allowed}
  button.ghost{background:#fff;color:#202036;border:1px solid #e9e8f2}
  pre{background:#fff;border:1px solid #e0d8ff;border-radius:8px;padding:12px;overflow:auto;font-size:12px;margin-top:12px;display:none}
  .section{border-top:1px solid #e9e8f2;margin-top:16px;padding-top:16px}
</style>
</head>
<body>

<h1>Firebase Diagnostic</h1>
<p class="sub">Tests Firebase init → sign-in → Firestore read → Firestore write.</p>

<!-- Sign-in block (needed for team-only reads) -->
<div class="section">
  <strong style="font-size:14px">Team sign-in (for read tests)</strong>
  <p style="font-size:12.5px;color:#77768b;margin:6px 0 10px">
    Reads on <code>mailRegistrations</code> require a signed-in team UID. Sign in with your admin account to test reads.
  </p>
  <input id="email" type="email" placeholder="admin@codebihin.in" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button id="signInBtn">Sign in</button>
  <button id="signOutBtn" class="ghost">Sign out</button>
  <div id="authStatus" style="font-size:12.5px;color:#77768b;margin-top:8px">Not signed in</div>
</div>

<div class="section">
  <button id="runBtn">▶ Run full diagnostic</button>
  <div id="results" style="margin-top:12px"></div>
</div>

<pre id="log"></pre>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs, limit, query, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBxdkXP48MtLOZwcNicQnBNQrXjjVf4C6E",
  authDomain: "edugm-unitools-donations.firebaseapp.com",
  projectId: "edugm-unitools-donations",
  storageBucket: "edugm-unitools-donations.firebasestorage.app",
  messagingSenderId: "359466843038",
  appId: "1:359466843038:web:d39f7ed498c1c3836f348f"
};

let app, auth, db;
try {
  app = initializeApp(FIREBASE_CONFIG);
  auth = getAuth(app);
  db = getFirestore(app);
  console.log("[diag] Firebase ready");
} catch (e) {
  console.error("[diag] init failed", e);
}

const $ = id => document.getElementById(id);
const results = $("results");
const logEl = $("log");
const authStatus = $("authStatus");

function row(status, title, detail) {
  const d = document.createElement("div");
  d.className = "row " + status;
  d.innerHTML = `<strong>${title}</strong>${detail ? " — " + detail : ""}`;
  results.appendChild(d);
}
function log(msg) {
  logEl.style.display = "block";
  logEl.textContent += msg + "\n";
}

/* ---- Auth UI ---- */
$("signInBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) { authStatus.textContent = "Enter email and password"; return; }
  authStatus.textContent = "Signing in…";
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    authStatus.textContent = "Signed in as " + cred.user.email;
    log("[auth] signed in: " + cred.user.uid);
  } catch (e) {
    authStatus.textContent = "Sign-in failed: " + e.message;
    log("[auth] FAIL " + e.code + " " + e.message);
  }
});
$("signOutBtn").addEventListener("click", async () => {
  try { await signOut(auth); authStatus.textContent = "Not signed in"; log("[auth] signed out"); }
  catch (e) { log("[auth] sign-out failed: " + e.message); }
});

onAuthStateChanged(auth, user => {
  if (user) authStatus.textContent = "Signed in as " + user.email + " (uid: " + user.uid + ")";
  else authStatus.textContent = "Not signed in";
});

/* ---- Full diagnostic ---- */
$("runBtn").addEventListener("click", async () => {
  results.innerHTML = "";
  logEl.textContent = "";
  $("runBtn").disabled = true;

  /* 1. Init */
  row("ok", "✓ Firebase init", "project: " + FIREBASE_CONFIG.projectId);
  log("[1] init OK");

  const user = auth.currentUser;
  row(user ? "ok" : "info", user ? "✓ Signed in" : "ℹ Not signed in",
      user ? user.email + " · uid " + user.uid : "Read tests will be denied (expected)");

  /* 2. Read mailRegistrations */
  try {
    const snap = await getDocs(query(collection(db, "mailRegistrations"), limit(1)));
    row("ok", "✓ Read mailRegistrations", "docs: " + snap.size);
    log("[2] read OK, docs=" + snap.size);
  } catch (e) {
    row("fail", "✗ Read mailRegistrations", "code: <code>" + e.code + "</code> — " + e.message);
    log("[2] FAIL " + e.code + " " + e.message);
    if (e.code === "permission-denied") {
      row("info", "→ Expected if not signed in", "Reads require a team UID. Sign in above, then re-run.");
    }
  }

  /* 3. Write mailRegistrations */
  try {
    const ref = await addDoc(collection(db, "mailRegistrations"), {
      fullName: "TEST — ignore",
      personalEmail: "diagnostic@test.local",
      phone: "0000000000",
      location: "Test",
      workspaceHandle: "diagnostic-test",
      workspaceEmail: "diagnostic-test@mail.codebihin.in",
      status: "pending",
      reference: "DIAG-" + Date.now(),
      submittedAt: serverTimestamp(),
      _diagnostic: true
    });
    row("ok", "✓ Write mailRegistrations", "doc id: <code>" + ref.id + "</code>");
    log("[3] write OK id=" + ref.id);
  } catch (e) {
    row("fail", "✗ Write mailRegistrations", "code: <code>" + e.code + "</code> — " + e.message);
    log("[3] FAIL " + e.code + " " + e.message);
  }

  /* 4. Write adminNotifications */
  try {
    const ref = await addDoc(collection(db, "adminNotifications"), {
      type: "diagnostic",
      createdAt: serverTimestamp(),
      read: false,
      _diagnostic: true
    });
    row("ok", "✓ Write adminNotifications", "doc id: <code>" + ref.id + "</code>");
    log("[4] write OK id=" + ref.id);
  } catch (e) {
    row("fail", "✗ Write adminNotifications", "code: <code>" + e.code + "</code> — " + e.message);
    log("[4] FAIL " + e.code + " " + e.message);
  }

  row("pending", "Done", "Delete the <code>_diagnostic: true</code> docs from Firestore when finished.");
  $("runBtn").disabled = false;
});
</script>
</body>
</html>
