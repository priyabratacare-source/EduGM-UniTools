<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Settings | EduGM Team Dashboard</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div id="gate" style="display:grid;place-items:center;min-height:100vh;color:#68778b;font-family:Arial,sans-serif;font-size:14px">
  Verifying access…
</div>

<div id="shell" style="display:none">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">EduGM <span>Team</span></div>
    <nav class="sidebar-nav">
      <a href="index.html"><span class="nav-icon">▦</span> Overview</a>
      <a href="donations.html"><span class="nav-icon">₹</span> Donations</a>
      <a href="audit.html"><span class="nav-icon">▤</span> Audit Logs</a>
      <a href="team.html"><span class="nav-icon">◍</span> Team</a>
      <a href="settings.html" class="active"><span class="nav-icon">⚙</span> Settings</a>
    </nav>
    <div class="sidebar-foot">
      Signed in as team member
      <button id="logoutBtn" type="button">Sign out</button>
    </div>
  </aside>

  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger" id="hamburger" type="button" aria-label="Toggle menu">☰</button>
      <h1>Settings</h1>
    </div>
    <div class="topbar-right">
      <span id="userChip" class="user-chip"></span>
    </div>
  </header>

  <main class="main">
    <div class="content">
      <div class="card">
        <div class="card-head">
          <div>
            <h2>Account</h2>
            <p class="sub">Your signed-in account details.</p>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><div class="lbl">Email</div><div class="val" style="font-size:15px;word-break:break-all" id="settingsEmail">—</div></div>
          <div class="stat"><div class="lbl">UID</div><div class="val" style="font-size:12px;font-family:monospace;word-break:break-all" id="settingsUid">—</div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div>
            <h2>Session</h2>
            <p class="sub">Control your current session.</p>
          </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-secondary" id="reloadBtn" type="button">Reload page</button>
          <button class="btn btn-primary" id="logoutBtnBottom" type="button">Sign out</button>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div>
            <h2>About</h2>
            <p class="sub">Dashboard information.</p>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><div class="lbl">Version</div><div class="val" style="font-size:16px">1.0.0</div></div>
          <div class="stat"><div class="lbl">Maintained by</div><div class="val" style="font-size:16px">CodeBihin</div></div>
          <div class="stat"><div class="lbl">Owner</div><div class="val" style="font-size:16px">EduGM</div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
import {
  guard, wireShell, auth, signOut, kickOut
} from "./dashboard.js";

const user = await guard();
document.getElementById("gate").style.display = "none";
document.getElementById("shell").style.display = "block";
wireShell(user);

document.getElementById("settingsEmail").textContent = user.email || "—";
document.getElementById("settingsUid").textContent = user.uid || "—";

document.getElementById("reloadBtn").addEventListener("click", () => location.reload());
document.getElementById("logoutBtnBottom").addEventListener("click", async () => {
  await signOut(auth);
  kickOut();
});
</script>
</body>
</html>
